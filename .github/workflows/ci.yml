name: Test and build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Test
        run: bash Tests/run.sh
      - name: Build ad-hoc signed app
        run: bash build.sh
      - name: Checksums
        working-directory: dist
        run: shasum -a 256 ReelsWhileGPT-arm64.zip > SHA256SUMS.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: reels-while-gpt-arm64-adhoc
          path: |
            dist/ReelsWhileGPT-arm64.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
